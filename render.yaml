services:
  - type: web
    name: ai-research-report-agent
    runtime: python

    buildCommand: pip install -r requirements.txt

    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT

    envVars:

      - key: LLM_PROVIDER
        value: openai

      - key: OPENAI_API_KEY
        sync: false

      - key: GROQ_API_KEY
        sync: false

      - key: TAVILY_API_KEY
        sync: false

      - key: OPENAI_MODEL
        value: gpt-4o-mini

      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile

      - key: MAX_RETRIES
        value: "4"

      - key: REQUEST_TIMEOUT_SECONDS
        value: "30"

      - key: LOG_LEVEL
        value: INFO